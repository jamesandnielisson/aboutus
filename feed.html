<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The title is filled in from js/content.js -->
  <title>Our Feed</title>
  <meta name="description" content="Little snapshots from our everyday life.">
  <meta name="theme-color" content="#FBF7F1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ============ TOP BAR ============ -->
  <header class="site-header" id="site-header">
    <nav class="nav container" aria-label="Main">
      <a class="nav__brand" href="index.html" data-content="names"></a>
      <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="nav-menu">
        <span class="nav__toggle-bars" aria-hidden="true"></span>
        <span class="visually-hidden">Menu</span>
      </button>
      <ul class="nav__menu" id="nav-menu">
        <li><a href="index.html#home" data-menu="home"></a></li>
        <li><a href="index.html#our-story" data-menu="story"></a></li>
        <li><a href="index.html#albums" data-menu="albums"></a></li>
        <li><a href="index.html#more" data-menu="more"></a></li>
        <li><a href="feed.html" data-menu="feed" class="is-active" aria-current="page"></a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="feed-page">
    <div class="container container--feed">
      <!-- ============ PROFILE ============ -->
      <header class="feed-profile">
        <img class="feed-profile__avatar" id="feed-avatar" src="" alt="">
        <div>
          <h1 class="feed-profile__title" id="feed-page-title"></h1>
          <p class="feed-profile__meta">
            <span class="feed-profile__names" data-content="names"></span>
            <span aria-hidden="true">·</span>
            <span id="feed-count"></span>
          </p>
          <p class="feed-profile__intro" id="feed-page-intro"></p>
        </div>
      </header>

      <!-- ============ ALL POSTS ============ -->
      <ul class="feed-grid" id="feed-page-grid" role="list"></ul>
      <p class="feed-empty" id="feed-empty" hidden>No posts yet. Check back soon!</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p><span id="footer-text"></span> · <span id="footer-year"></span></p>
    </div>
  </footer>

  <!-- ============ ONE POST (opens over the page) ============ -->
  <dialog class="post-dialog" id="post-dialog" aria-label="Post">
    <div class="post-dialog__panel">
      <figure class="post-dialog__media" id="post-media">
        <img id="post-img" src="" alt="" draggable="false">
      </figure>
      <div class="post-dialog__body">
        <header class="post-dialog__header">
          <img class="post-dialog__avatar" id="post-avatar" src="" alt="">
          <div class="post-dialog__who">
            <strong data-content="names"></strong>
            <span id="post-place"></span>
          </div>
          <button class="icon-button" type="button" data-close-post aria-label="Close post">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </header>
        <div class="post-dialog__text" id="post-text"></div>
        <footer class="post-dialog__footer">
          <time class="post-dialog__date" id="post-date"></time>
          <div class="post-dialog__nav">
            <button class="icon-button" type="button" id="post-prev" aria-label="Previous post">
              <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <span class="post-dialog__counter" id="post-counter" aria-live="polite"></span>
            <button class="icon-button" type="button" id="post-next" aria-label="Next post">
              <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </footer>
      </div>
    </div>
  </dialog>

  <noscript>
    <p class="noscript">This website needs JavaScript turned on to show its content.</p>
  </noscript>

  <!-- Your content first, then the code that builds the page from it -->
  <script src="js/content.js"></script>
  <script src="js/feed-posts.js"></script>
  <script src="js/feed.js"></script>
</body>
</html>
