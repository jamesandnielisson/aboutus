<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The title and description are filled in from js/content.js -->
  <title>Our Story</title>
  <meta name="description" content="Get to know us — our story, our life together and our hopes for the future.">
  <meta name="theme-color" content="#FBF7F1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ============ TOP MENU ============ -->
  <header class="site-header" id="site-header">
    <nav class="nav container" aria-label="Main">
      <a class="nav__brand" href="#home" data-content="names"></a>
      <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="nav-menu">
        <span class="nav__toggle-bars" aria-hidden="true"></span>
        <span class="visually-hidden">Menu</span>
      </button>
      <ul class="nav__menu" id="nav-menu">
        <li><a href="#home" data-menu="home"></a></li>
        <li><a href="#our-story" data-menu="story"></a></li>
        <li><a href="#albums" data-menu="albums"></a></li>
        <li><a href="#more" data-menu="more"></a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <!-- ============ 1. WELCOME ============ -->
    <section class="hero" id="home" aria-labelledby="hero-title">
      <div class="container hero__inner">
        <div class="hero__text">
          <p class="eyebrow" id="hero-eyebrow"></p>
          <h1 class="hero__title" id="hero-title"></h1>
          <div class="hero__intro" id="hero-intro"></div>
          <a class="button" href="#our-story" id="hero-button">
            <span></span>
            <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14m0 0-6-6m6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </div>
        <figure class="hero__media">
          <img id="hero-image" src="" alt="" fetchpriority="high">
        </figure>
      </div>
    </section>

    <!-- "Our Story" menu link points here: the video + the story chapters -->
    <div id="our-story">
      <!-- ============ 2. INTRODUCTION VIDEO ============ -->
      <section class="section section--tint video" id="video" aria-labelledby="video-title">
        <div class="container container--narrow">
          <header class="section__header">
            <h2 class="section__title" id="video-title"></h2>
            <p class="section__intro" id="video-intro"></p>
          </header>
          <div class="video__frame" id="video-frame"></div>
          <p class="video__caption" id="video-caption" hidden></p>
        </div>
      </section>

      <!-- ============ 3. OUR STORY ============ -->
      <section class="section story" id="story" aria-labelledby="story-title">
        <div class="container">
          <header class="section__header">
            <h2 class="section__title" id="story-title"></h2>
            <p class="section__intro" id="story-intro"></p>
          </header>
          <div class="story__chapters" id="story-chapters"></div>
        </div>
      </section>
    </div>

    <!-- ============ 4. PHOTO ALBUMS ============ -->
    <section class="section section--tint albums" id="albums" aria-labelledby="albums-title">
      <div class="container">
        <header class="section__header">
          <h2 class="section__title" id="albums-title"></h2>
          <p class="section__intro" id="albums-intro"></p>
        </header>
        <ul class="albums__grid" id="albums-grid" role="list"></ul>
      </div>
    </section>

    <!-- ============ 5. MORE ABOUT US ============ -->
    <section class="section more" id="more" aria-labelledby="more-title">
      <div class="container">
        <header class="section__header">
          <h2 class="section__title" id="more-title"></h2>
          <p class="section__intro" id="more-intro"></p>
        </header>
        <ul class="more__grid" id="more-grid" role="list"></ul>
      </div>
    </section>

    <!-- ============ 5b. FEED PREVIEW (the full feed is on feed.html) ============ -->
    <section class="section feed-preview" id="feed" aria-labelledby="feed-title">
      <div class="container">
        <header class="section__header">
          <h2 class="section__title" id="feed-title"></h2>
          <p class="section__intro" id="feed-intro"></p>
        </header>
        <ul class="feed-grid feed-grid--preview" id="feed-grid" role="list"></ul>
        <p class="feed-preview__more">
          <a class="button button--ghost" href="feed.html" id="feed-button">
            <span></span>
            <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h14m0 0-6-6m6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </p>
      </div>
    </section>

    <!-- ============ 6. CLOSING ============ -->
    <section class="section section--tint closing" id="closing" aria-labelledby="closing-title">
      <div class="container container--narrow closing__inner">
        <div class="closing__collage" id="closing-collage"></div>
        <h2 class="section__title" id="closing-title"></h2>
        <div class="closing__text" id="closing-text"></div>
        <p class="closing__signature" id="closing-signature"></p>
        <a class="button button--ghost" href="#home" id="closing-button">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="M12 19V5m0 0-6 6m6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span></span>
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p><span id="footer-text"></span> · <span id="footer-year"></span></p>
    </div>
  </footer>

  <!-- ============ ALBUM WINDOW (opens over the page) ============ -->
  <dialog class="album-dialog" id="album-dialog" aria-labelledby="album-dialog-title">
    <div class="album-dialog__panel">
      <header class="album-dialog__header">
        <div>
          <h2 class="album-dialog__title" id="album-dialog-title"></h2>
          <p class="album-dialog__desc" id="album-dialog-desc"></p>
        </div>
        <button class="icon-button" type="button" data-close-album aria-label="Close album">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </header>
      <ul class="album-dialog__grid" id="album-dialog-grid" role="list"></ul>
    </div>
  </dialog>

  <!-- ============ PHOTO VIEWER (one large photo) ============ -->
  <dialog class="viewer" id="viewer" aria-label="Photo viewer">
    <div class="viewer__top">
      <p class="viewer__counter" id="viewer-counter" aria-live="polite"></p>
      <button class="icon-button icon-button--light" type="button" data-close-viewer aria-label="Close photo">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <figure class="viewer__stage" id="viewer-stage">
      <img class="viewer__img" id="viewer-img" src="" alt="" draggable="false">
      <figcaption class="viewer__caption" id="viewer-caption"></figcaption>
    </figure>
    <button class="viewer__nav viewer__nav--prev icon-button icon-button--light" type="button" id="viewer-prev" aria-label="Previous photo">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="26" height="26"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="viewer__nav viewer__nav--next icon-button icon-button--light" type="button" id="viewer-next" aria-label="Next photo">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="26" height="26"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </dialog>

  <noscript>
    <p class="noscript">This website needs JavaScript turned on to show its content.</p>
  </noscript>

  <!-- Your content first, then the code that builds the page from it -->
  <script src="js/content.js"></script>
  <script src="js/feed-posts.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
